<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: #1b2a1b;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
  }
  .wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
  }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }

  #muteBtn {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 1000;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .45);
    background: rgba(0, 0, 0, .45);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  #muteBtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  /* ---------- Message card (after the transition) ---------- */
  #popup {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(18, 4, 12, .35);
  }
  #popup.show { display: grid; }
  .card {
    text-align: center;
    padding: 4% 6%;
    max-width: 80%;
    border-radius: 24px;
    color: #fff0f5;
    background: linear-gradient(160deg, #e0115f, #7a0b3a);
    border: 3px solid #ffc2d6;
    box-shadow: 0 0 60px rgba(255, 45, 111, .7);
    animation: pop .8s cubic-bezier(.2, 1.7, .4, 1) both;
  }
  .card h1 { font-size: clamp(26px, 5.5vw, 64px); margin-bottom: .3em; }
  .card p  { font-size: clamp(16px, 2.8vw, 34px); line-height: 1.35; }
  .btn {
    margin-top: 1.2em;
    padding: .55em 1.4em;
    border: 0;
    border-radius: 999px;
    background: #fff0f5;
    color: #b00c4c;
    font: bold clamp(14px, 2vw, 22px) Georgia, serif;
    cursor: pointer;
  }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @keyframes pop {
    from { transform: scale(0) rotate(-10deg); opacity: 0; }
    to   { transform: scale(1) rotate(0);      opacity: 1; }
  }

  /* ---------- Letter screen ---------- */
  #letter {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    overflow: auto;
    padding: 20px;
    background: radial-gradient(circle at 50% 40%, #5a1238, #12040c 75%);
  }
  #letter.show { display: grid; }

  .bg-heart {
    position: fixed;
    bottom: -40px;
    color: #ff5c8a;
    opacity: 0;
    animation: rise linear infinite;
    pointer-events: none;
  }
  @keyframes rise {
    0%   { transform: translateY(0); opacity: 0; }
    10%  { opacity: .6; }
    100% { transform: translateY(-115vh); opacity: 0; }
  }

  .envelope {
    position: absolute;
    width: min(320px, 80vw);
    aspect-ratio: 3 / 2;
    animation: envelope 3s ease-in-out forwards;
  }
  .env-back  { position: absolute; inset: 0; background: #e6c79c; border-radius: 6px; }
  .env-front {
    position: absolute; inset: 0; border-radius: 6px;
    background: #f1d9b3;
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    z-index: 2;
  }
  .flap {
    position: absolute; top: 0; left: 0; width: 100%; height: 55%;
    background: #d9b88a;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    z-index: 3;
    animation: flap 1s .6s ease-in-out forwards;
  }
  .seal {
    position: absolute; left: 50%; top: 42%;
    transform: translate(-50%, -50%);
    color: #c4124d; font-size: 34px; z-index: 4;
    animation: sealOut .3s .6s forwards;
  }
  @keyframes envelope {
    0%   { opacity: 0; transform: translateY(20px); }
    15%  { opacity: 1; transform: translateY(0); }
    75%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(70px); }
  }
  @keyframes flap {
    0%   { transform: scaleY(1);  z-index: 3; }
    49%  { transform: scaleY(0);  z-index: 3; }
    50%  { z-index: 0; }
    100% { transform: scaleY(-1); z-index: 0; }
  }
  @keyframes sealOut { to { opacity: 0; } }

  .paper {
    position: relative;
    width: min(560px, 92vw);
    max-height: 86vh;
    overflow-y: auto;
    padding: 36px 34px 28px;
    color: #4a2a2a;
    background:
      repeating-linear-gradient(transparent 0 31px, rgba(196, 18, 77, .12) 31px 32px),
      #fff8ee;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
    opacity: 0;
    animation: paperIn 1s 2.3s cubic-bezier(.2, 1.2, .3, 1) forwards;
  }
  @keyframes paperIn {
    from { opacity: 0; transform: translateY(50px) scale(.7); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .paper h2 { font-size: 1.8rem; font-style: italic; margin-bottom: 16px; }
  .paper p  { font-size: 1.08rem; line-height: 32px; margin-bottom: 14px; }
  .paper .sign { margin-top: 18px; font-style: italic; font-size: 1.2rem; line-height: 1.5; white-space: pre-line; }
  .paper .link {
    display: block; margin: 22px auto 0;
    background: none; border: 0; color: #b00c4c;
    font: 15px Georgia, serif; text-decoration: underline; cursor: pointer;
  }
  .paper .link:focus-visible { outline: 2px solid #b00c4c; outline-offset: 3px; }

  .paper .btn {
    display: block;
    margin: 24px auto 0;
    background: #c4124d;
    color: #fff;
  }

  /* ---------- Black screen: "I love you" in 20 languages ---------- */
  #finale {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }
  #finale.show { display: flex; animation: fadeIn 1.2s both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #finaleCanvas { width: 100%; height: 100%; display: block; }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .envelope { display: none; }
    .paper { animation: none; opacity: 1; }
    .bg-heart { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <canvas id="game" aria-label="Archery game: aim with the pointer and click to shoot the target"></canvas>
  <div id="popup" role="dialog" aria-live="polite">
    <div class="card">
      <h1 id="msgTitle"></h1>
      <p id="msgText"></p>
      <button class="btn" id="readLetter">Read the letter</button>
    </div>
  </div>
</div>

<div id="letter" role="dialog" aria-label="Letter">
  <div class="envelope" aria-hidden="true">
    <div class="env-back"></div>
    <div class="flap"></div>
    <div class="seal">&#9829;</div>
    <div class="env-front"></div>
  </div>
  <article class="paper">
    <h2 id="letterTitle"></h2>
    <div id="letterBody"></div>
    <p class="sign" id="letterSign"></p>
    <button class="btn" id="finaleBtn">One last thing &#9829;</button>
  </article>
</div>

<div id="finale" role="dialog" aria-label="A heart filled with the name Yesha">
  <canvas id="finaleCanvas" aria-label="A heart filled with the name Yesha"></canvas>
</div>

<button id="muteBtn" aria-label="Mute sound" aria-pressed="false">&#128266;</button>

<script>
  // ============ EDIT THESE ============
  const HITS_NEEDED   = 5;
  const MESSAGE_TITLE = "Hi Crush >_<";
  const MESSAGE_TEXT  = "";

  const LETTER_TITLE = "To Yesha Camachows,";
  const LETTER_BODY = [
    "So uhmm, hi pooo sooo I guess you've noticed or nahalata mo sakin to hehe and yesss I have a crush on youuuu its very big like dinosaur big rauwr",
    "Anyways, jokes aside I actually have a crush on you po like very big and sa totoo lang bihira lang ako magka gusto kaya eto ako nga baliw na baliw sayooo partida kahit crush ko palang loyal na agad ako kahit taon man yan.",
    "Also I want to know you better po hehe. Actually sabi ko sa sarili ko inde muna ako magkakagusto sa ibang tao pero simula nung nakaka encounter kita unti-unti rin nagbabago ung desisyon ko",
    "then nahihiya talaga ako kasi its my first time na umamin sa ibang tao, kahit nga ako di makapaniwala na ginagawa ko to ngayon eh",
    "and siguro to you, random na tao lang ako na biglang nagkagusto sayo, ikaw kasi!! ang ganda mo lagi WHAHHAHA and alam kong wala akong chance sayo pero ang laki ng chance mo sakin😝😝😝 actually ewan kung may chance ako sayo and sana meron hehe.",
    "Siguro kung iniisip mo ngayon no I don't want your commitment agad kasi we are still students and priority parin ang makipagaral and this is just my way of showing my affection and to express my feelings for youuu kasi kung iisipin mo nga naman its hard magkarelationship ngayon",
    "and just to be clear po, I'm not saying na ayaw ko ng commitment or anything like that. I just don't want us to rush into something we're not entirely ready for. I want to take things slowly, get to know you better, and see where this goes. If things work out between us, then I'd genuinely be happy to see where we could go. I just want us to enjoy getting to know each other without putting too much pressure on ourselves hehe."
  ];
  const LETTER_SIGN = "Always yours,\nAshhhh";

  // ---- Sound ----
  // Music and sound effects are made by the browser, so no audio files are needed.
  // To use your own songs instead, put the files next to this HTML file and type their names:
  const GAME_MUSIC_FILE = "";   // song while playing, e.g. "game.mp3"
  const LOVE_MUSIC_FILE = "it-might-be-you.mp3";   // song for the ending, e.g. "love.mp3"
  const LETTER_MUSIC_FILE = "pwede-ka-ba.mp3";   // song that starts when "One last thing" is pressed
                                              // (put your copy of the file next to this HTML file)
  const MUSIC_VOLUME = 0.5;     // 0 to 1
  const SFX_VOLUME   = 0.8;     // 0 to 1
  // ====================================

  const W = 960, H = 540;
  const GROUND = 470;
  const BOW = { x: 110, y: 385 };
  const GRAVITY = 900;          // higher = arrows drop faster
  const TARGET_X = 820;
  const TARGET_R = 42;

  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr;
  cv.height = H * dpr;

  const popup = document.getElementById("popup");
  const letter = document.getElementById("letter");
  document.getElementById("msgTitle").textContent = MESSAGE_TITLE;
  document.getElementById("msgText").textContent = MESSAGE_TEXT;
  document.getElementById("letterTitle").textContent = LETTER_TITLE;
  document.getElementById("letterSign").textContent = LETTER_SIGN;
  LETTER_BODY.forEach(t => {
    const p = document.createElement("p");
    p.textContent = t;
    document.getElementById("letterBody").appendChild(p);
  });

  // ---------- Sound ----------
  const snd = (() => {
    let ac = null, master, mIn, sfx, reverb, noiseBuf;
    let muted = false, pending = "game", cur = "off", mode = "off", timer = 0, nextT = 0, step = 0;
    const files = {};
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const FILE_FOR = { game: GAME_MUSIC_FILE, love: LOVE_MUSIC_FILE, letter: LETTER_MUSIC_FILE };

    // Chords and melody for the two tunes (MIDI note numbers)
    const GAME_CH = [[60, 64, 67, 72], [55, 59, 62, 67], [57, 60, 64, 69], [53, 57, 60, 65]];
    const ARP = [0, 1, 2, 3, 2, 1, 2, 1];
    const LOVE_CH = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [60, 64, 67]];
    const LOVE_BASS = [45, 41, 43, 48];
    const LOVE_MEL = [76, 79, 81, 79, 77, 76, 74, 72, 74, 76, 79, 76, 72, 74, 76, 0];
    const PENTA = [1046.5, 1174.7, 1318.5, 1568, 1760, 2093];

    function init() {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = muted ? 0 : 1;
        master.connect(ac.destination);

        // a soft, dreamy reverb made from decaying noise
        const len = Math.floor(ac.sampleRate * 2.6);
        const buf = ac.createBuffer(2, len, ac.sampleRate);
        for (let c = 0; c < 2; c++) {
          const d = buf.getChannelData(c);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
        }
        reverb = ac.createConvolver();
        reverb.buffer = buf;
        const rv = ac.createGain();
        rv.gain.value = 0.55;
        reverb.connect(rv);
        rv.connect(master);

        mIn = ac.createGain();                 // music goes in here
        mIn.gain.value = 0;
        mIn.connect(master);
        mIn.connect(reverb);
        sfx = ac.createGain();                 // sound effects go in here
        sfx.gain.value = SFX_VOLUME;
        sfx.connect(master);
        const sr = ac.createGain();
        sr.gain.value = 0.18;
        sfx.connect(sr);
        sr.connect(reverb);

        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const nd = noiseBuf.getChannelData(0);
        for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

        document.addEventListener("visibilitychange", () => {
          if (!ac) return;
          if (document.hidden) ac.suspend(); else ac.resume();
        });
        ["game", "love", "letter"].forEach(getEl);       // start loading any songs right away
      }
      if (ac.state !== "running") ac.resume();
      if (pending !== cur) applyMusic(pending, 1.5);
    }

    // ----- music -----
    function note(freq, t, dur, type, vol, attack, dest) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(dest);
      o.start(t);
      o.stop(t + dur + 0.05);
    }
    const mnote = (f, t, d, type, v, a = 0.01) => note(f, t, d, type, v, a, mIn);

    function playStep(t) {
      if (mode === "game") {                   // light music-box arpeggio
        const bar = Math.floor(step / 8) % 4, i = step % 8, ch = GAME_CH[bar];
        const n = ch[ARP[i]];
        mnote(mtof(n), t, 0.9, "triangle", 0.07);
        mnote(mtof(n + 12), t, 0.5, "sine", 0.02);
        if (i === 0) mnote(mtof(ch[0] - 12), t, 1.8, "sine", 0.09, 0.03);
      } else if (mode === "love") {            // slow, warm pads with a bell melody
        const bar = Math.floor(step / 4) % 4, i = step % 4, ch = LOVE_CH[bar];
        if (i === 0) {
          ch.forEach(n => {
            mnote(mtof(n), t, 4.2, "triangle", 0.03, 0.8);
            mnote(mtof(n) * 1.004, t, 4.2, "triangle", 0.03, 0.8);
          });
          mnote(mtof(LOVE_BASS[bar]), t, 3.8, "sine", 0.1, 0.05);
        }
        const m = LOVE_MEL[step % 16];
        if (m) {
          mnote(mtof(m), t, 2.4, "sine", 0.08);
          mnote(mtof(m) * 2, t, 1.2, "sine", 0.02);
        }
        if (i % 2 === 1) mnote(mtof(ch[(i >> 1) % 3] + 24), t + 0.45, 0.9, "sine", 0.02);
      }
      step++;
    }
    function schedule() {
      if (!ac || (mode !== "game" && mode !== "love")) return;
      const len = mode === "love" ? 0.9 : 0.3;
      while (nextT < ac.currentTime + 0.4) { playStep(nextT); nextT += len; }
    }
    function ramp(param, v, secs) {
      const now = ac.currentTime;
      param.cancelScheduledValues(now);
      param.setValueAtTime(param.value, now);
      param.linearRampToValueAtTime(v, now + secs);
    }
    function fadeEl(el, to, secs, pauseAfter) {
      clearInterval(el._t);
      const from = el.volume, steps = Math.max(1, Math.round(secs * 20));
      let i = 0;
      el._t = setInterval(() => {
        i++;
        el.volume = clamp(from + (to - from) * (i / steps), 0, 1);
        if (i >= steps) { clearInterval(el._t); if (pauseAfter) el.pause(); }
      }, 50);
    }
    function getEl(m) {
      if (!FILE_FOR[m]) return null;
      let el = files[m];
      if (!el) {
        el = files[m] = new Audio(FILE_FOR[m]);
        el.loop = true;
        el.volume = 0;
        el.preload = "auto";
        // if the song can't be loaded, use the built-in tune instead of silence
        el.onerror = () => { if (cur === m) startSynth(m === "game" ? "game" : "love", 1.5); };
      }
      return el;
    }
    function applyMusic(m, fade) {
      pending = m;
      if (!ac) return;
      cur = m;
      for (const k in files) fadeEl(files[k], 0, Math.min(fade, 1), true);
      if (m === "off") { ramp(mIn.gain, 0, fade); mode = "off"; return; }
      const el = getEl(m);
      if (el) {                                // your own song
        mode = "off";
        ramp(mIn.gain, 0, 0.5);
        el.muted = muted;
        el.play().catch(() => { if (cur === m && el.error) startSynth(m === "game" ? "game" : "love", 1.5); });
        fadeEl(el, MUSIC_VOLUME, fade, false);
      } else {                                 // the built-in tune
        startSynth(m === "game" ? "game" : "love", fade);
      }
    }
    function startSynth(m, fade) {
      mode = m;
      step = 0;
      nextT = ac.currentTime + 0.1;
      ramp(mIn.gain, MUSIC_VOLUME * 1.6, fade);
      if (!timer) timer = setInterval(schedule, 100);
    }

    // ----- sound effects -----
    const ready = () => ac && !muted && ac.state === "running";
    function tone(f0, t, dur, type, vol, f1) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(sfx);
      o.start(t);
      o.stop(t + dur + 0.05);
    }
    function noise(t, dur, f0, f1, type, vol) {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noiseBuf;
      f.type = type;
      f.Q.value = 1.1;
      f.frequency.setValueAtTime(f0, t);
      f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f);
      f.connect(g);
      g.connect(sfx);
      s.start(t);
      s.stop(t + dur + 0.05);
    }

    return {
      init,
      music: (m, fade = 1.5) => applyMusic(m, fade),
      setMuted(v) {
        muted = v;
        if (ac) master.gain.setTargetAtTime(v ? 0 : 1, ac.currentTime, 0.05);
        for (const k in files) files[k].muted = v;
      },
      shoot() {                                // bowstring twang and a whoosh
        if (!ready()) return;
        const t = ac.currentTime;
        noise(t, 0.28, 1800, 350, "bandpass", 0.35);
        noise(t, 0.04, 5000, 3000, "highpass", 0.2);
        tone(240, t, 0.3, "triangle", 0.22, 120);
      },
      hit(n) {                                 // thunk + a bell that climbs with each hit
        if (!ready()) return;
        const t = ac.currentTime, f = [523.25, 587.33, 659.25, 783.99, 1046.5][clamp(n, 1, 5) - 1];
        tone(150, t, 0.2, "sine", 0.55, 60);
        noise(t, 0.08, 900, 300, "lowpass", 0.4);
        tone(f, t + 0.02, 1.0, "triangle", 0.28);
        tone(f * 2.005, t + 0.02, 0.6, "sine", 0.1);
      },
      miss(lost) {                             // soft thud, and a sad little slide if a point was lost
        if (!ready()) return;
        const t = ac.currentTime;
        tone(170, t, 0.22, "sine", 0.35, 70);
        noise(t, 0.12, 700, 200, "lowpass", 0.25);
        if (lost) {
          tone(330, t + 0.05, 0.25, "triangle", 0.16, 200);
          tone(247, t + 0.25, 0.35, "triangle", 0.16, 150);
        }
      },
      tension() {                              // the frozen moment: rising hum and cracking glass
        if (!ready()) return;
        const t = ac.currentTime;
        tone(110, t, 0.55, "sine", 0.3, 900);
        tone(60, t, 0.5, "sine", 0.35, 45);
        [0.05, 0.17, 0.3].forEach(d => noise(t + d, 0.06, 5000, 2500, "highpass", 0.45));
      },
      shatter() {                              // the break
        if (!ready()) return;
        const t = ac.currentTime;
        noise(t, 1.0, 6000, 700, "highpass", 0.8);
        tone(70, t, 0.7, "sine", 0.7, 30);
        for (let i = 0; i < 16; i++) {
          tone(1400 + Math.random() * 4200, t + Math.random() * 0.8, 0.25 + Math.random() * 0.35, "sine", 0.1);
        }
        [1046.5, 1318.5, 1568].forEach((f, i) => tone(f, t + 0.2 + i * 0.07, 2.2, "sine", 0.12));
      },
      pop() {                                  // the message card appearing
        if (!ready()) return;
        const t = ac.currentTime;
        tone(500, t, 0.14, "sine", 0.3, 1100);
        [784, 988, 1175, 1568].forEach((f, i) => tone(f, t + 0.08 + i * 0.07, 0.6, "triangle", 0.12));
      },
      paper() {                                // opening the envelope
        if (!ready()) return;
        const t = ac.currentTime;
        noise(t, 0.35, 2600, 1100, "bandpass", 0.22);
        noise(t + 0.4, 0.4, 2200, 900, "bandpass", 0.2);
      },
      chime() {
        if (!ready()) return;
        const t = ac.currentTime;
        [1046.5, 1568, 2093].forEach((f, i) => tone(f, t + i * 0.12, 1.6, "sine", 0.1));
      },
      swell() {                                // going to the final screen
        if (!ready()) return;
        const t = ac.currentTime;

    const N = 600, poly = [];

      t.x += t.vx * dt;
      t.y += t.vy * dt;

  // Break the frozen picture into shards that fly away from the impact
  function startShatter() {

          rot: 0, vr: (Math.random() - 0.5) * 5,
          age: 0, delay: d / 1800

    burst(TARGET_X, target.y, 60, "\u2665", PINKS, 650, 30);

  // ---------- Drawing: shared pieces ----------
  function drawArrow(x, y, angle, len, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.strokeStyle = "#8b5a2b";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(-4, 0); ctx.stroke();
    ctx.fillStyle = "#8d949b";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-12, -5); ctx.lineTo(-12, 5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#d33";
    ctx.lineWidth = 2;
    for (const d of [0, 7, 14]) {
      ctx.beginPath(); ctx.moveTo(-len + d, 0); ctx.lineTo(-len + d - 7, -6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-len + d, 0); ctx.lineTo(-len + d - 7, 6); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBow(angle) {
    ctx.save();
    ctx.translate(BOW.x, BOW.y);
    ctx.rotate(angle);
    const cx = -20, R = 58, lim = 1.0;
    const e1 = [cx + R * Math.cos(-lim), R * Math.sin(-lim)];
    const e2 = [cx + R * Math.cos(lim),  R * Math.sin(lim)];
    const pull = state === "play" ? 16 : 0;
    ctx.strokeStyle = "#7a4a1e";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(cx, 0, R, -lim, lim); ctx.stroke();
    ctx.strokeStyle = "#f4f4f4";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(e1[0], e1[1]); ctx.lineTo(-pull, 0); ctx.lineTo(e2[0], e2[1]); ctx.stroke();
    ctx.restore();
    if (state === "play") {
      const nx = BOW.x - Math.cos(angle) * 16, ny = BOW.y - Math.sin(angle) * 16;
      drawArrow(nx + Math.cos(angle) * 66, ny + Math.sin(angle) * 66, angle, 66, 1);
    }
    ctx.fillStyle = "#6b4a2b";
    ctx.fillRect(BOW.x - 6, BOW.y + 52, 12, GROUND - BOW.y - 52);
  }

  function drawTrajectory() {
    const { angle, power } = aimInfo();
    let x = BOW.x + Math.cos(angle) * 50, y = BOW.y + Math.sin(angle) * 50;
    let vx = Math.cos(angle) * power, vy = Math.sin(angle) * power;
    const step = 0.045;
    for (let i = 0; i < 26; i++) {
      vy += GRAVITY * step; x += vx * step; y += vy * step;
      if (y > GROUND || x > W) break;
      ctx.globalAlpha = 0.7 * (1 - i / 26);
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawTarget() {
    const x = TARGET_X, y = target.y;
    const sc = 1 + 0.12 * target.pulse;
    // rail
    ctx.fillStyle = "#8a6a3f";
    ctx.fillRect(x - 4, 55, 8, GROUND - 55);
    ctx.fillRect(x - 28, GROUND - 6, 56, 8);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    const rings = [["#f6f6f6", 42], ["#222", 34], ["#2a7fd4", 26], ["#d92b2b", 18], ["#f4c20d", 9]];
    for (const [c, r] of rings) {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
    for (const st of stuck) {
      drawArrow(x + st.ox, y + st.oy, st.angle, 46, state === "won" ? 1 : Math.min(1, st.life * 2));
    }
  }

  function scoreBox() {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(16, 16, 150, 40, 10);
    else ctx.rect(16, 16, 150, 40);
  }

  // ---------- Drawing: the normal daytime scene ----------
  function drawNormal() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, "#6ec3f2");
    sky.addColorStop(1, "#d6f0fb");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#fff3a8";                      // sun
    ctx.beginPath(); ctx.arc(640, 70, 34, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,.9)";         // clouds
    for (const c of clouds) {
      for (const [dx, dy, r] of [[0, 0, 26], [28, -10, 32], [58, 0, 24], [30, 8, 28]]) {
        ctx.beginPath(); ctx.arc(c.x + dx * c.s, c.y + dy * c.s, r * c.s, 0, Math.PI * 2); ctx.fill();
      }
    }

    ctx.fillStyle = "#7fb069";                      // far hills
    ctx.beginPath(); ctx.moveTo(0, GROUND);
    ctx.bezierCurveTo(150, 330, 300, 330, 450, 400);
    ctx.bezierCurveTo(600, 340, 780, 340, W, 390);
    ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#5fa53d";                      // grass
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = "#4b8a2e";
    ctx.fillRect(0, GROUND, W, 5);

    for (const g of groundArrows) drawArrow(g.x, g.y + 2, g.angle, 46, Math.min(1, g.life * 2));
    drawTarget();
    if (state === "play") drawTrajectory();
    drawBow(aimInfo().angle);
    for (const a of arrows) drawArrow(a.x, a.y, a.angle, 46, 1);

    // HUD
    ctx.fillStyle = "rgba(255,255,255,.85)";
    scoreBox(); ctx.fill();
    if (missFlash > 0) {
      ctx.fillStyle = "rgba(220, 40, 40, " + (0.55 * missFlash) + ")";
      scoreBox(); ctx.fill();
    }
    ctx.fillStyle = "#24331f";
    ctx.font = "bold 20px Georgia, serif";
    ctx.textAlign = "left";
    ctx.fillText("Hits: " + hits + " / " + HITS_NEEDED, 30, 43);

    for (const f of floaters) {
      ctx.globalAlpha = Math.min(1, f.life * 1.5);
      ctx.fillStyle = "#c62828";
      ctx.font = "bold 26px Georgia, serif";
      ctx.textAlign = "center";
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    if (shots === 0 && state === "play") {
      ctx.fillStyle = "#24331f";
      ctx.textAlign = "center";
      ctx.font = "20px Georgia, serif";
      ctx.fillText("Move to aim \u00B7 click or tap to shoot", W / 2, 50);
    }
  }

  // ---------- Drawing: the romantic scene revealed by the transition ----------
  function drawRomantic(pop) {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, "#1a0612");
    sky.addColorStop(1, "#6a1840");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#fff";
    for (const s of stars) {
      ctx.globalAlpha = 0.4 + 0.3 * Math.sin(time * 2 + s.x);
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#2a0d1e";
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = "#ff5c8a";
    ctx.fillRect(0, GROUND, W, 3);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ff5c8a";
    for (const r of rise) {
      ctx.globalAlpha = 0.75;
      ctx.font = r.size + "px serif";
      ctx.fillText("\u2665", r.x, r.y);
    }
    ctx.globalAlpha = 1;
    ctx.textBaseline = "alphabetic";

    // the target becomes a heart
    const beat = 1 + 0.08 * Math.sin(time * 8);
    ctx.save();
    ctx.shadowColor = "#ff2d6f";
    ctx.shadowBlur = 35;
    const g = ctx.createRadialGradient(TARGET_X - 12, target.y - 14, 4, TARGET_X, target.y, 50);
    g.addColorStop(0, "#ff8fb1");
    g.addColorStop(1, "#e0115f");
    ctx.fillStyle = g;
    traceHeart(TARGET_X, target.y, 2.3 * beat * pop);
    ctx.fill();
    ctx.restore();
  }

  function drawCracks() {
    const p = clamp(winT / 0.3, 0, 1);
    ctx.strokeStyle = "rgba(255, 255, 255, .95)";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (const c of cracks) {
      const ca = Math.cos(c.a), sa = Math.sin(c.a);
      const mx = TARGET_X + ca * c.len * 0.5 * p - sa * c.kink;
      const my = target.y + sa * c.len * 0.5 * p + ca * c.kink;
      ctx.beginPath();
      ctx.moveTo(TARGET_X, target.y);
      ctx.lineTo(mx, my);
      ctx.lineTo(TARGET_X + ca * c.len * p, target.y + sa * c.len * p);
      ctx.stroke();
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!shattered) {
      // Before the break: the normal game, trembling after the last hit
      const trigger = state === "won" && winT >= 0.5;
      const amp = state === "won" && !trigger ? (winT / 0.5) * 7 : 0;
      ctx.save();
      if (amp > 0) ctx.translate((Math.random() - 0.5) * amp, (Math.random() - 0.5) * amp);
      drawNormal();
      if (state === "won") drawCracks();
      ctx.restore();
      if (trigger) startShatter();
    } else {
      // The break: the picture falls away and the night scene is underneath
      const q = clamp((winT - 0.5) / 0.7, 0, 1);
      const pop = 1 + 2.70158 * Math.pow(q - 1, 3) + 1.70158 * Math.pow(q - 1, 2);
      drawRomantic(pop);
      for (const t of tiles) {
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(t.rot);
        ctx.drawImage(snap, t.sx * dpr, t.sy * dpr, t.w * dpr, t.h * dpr, -t.w / 2, -t.h / 2, t.w, t.h);
        ctx.strokeStyle = "rgba(255, 255, 255, .35)";
        ctx.lineWidth = 1;
        ctx.strokeRect(-t.w / 2, -t.h / 2, t.w, t.h);
        ctx.restore();
      }
      const flash = 1 - (winT - 0.5) / 0.35;
      if (flash > 0) {
        ctx.fillStyle = "rgba(255, 255, 255, " + flash + ")";
        ctx.fillRect(0, 0, W, H);
      }
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.font = p.size + "px serif";
      ctx.fillText(p.ch, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    ctx.textBaseline = "alphabetic";
  }

  // ---------- Loop ----------
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.033);
    prev = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
